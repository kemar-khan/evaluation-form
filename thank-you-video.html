<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You Video</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --primary-light: #38bdf8;
            --secondary: #06b6d4;
            --accent: #3b82f6;
            --success: #10b981;
            --bg-main: #0a0e1a;
            --bg-card: rgba(15, 23, 42, 0.8);
            --bg-overlay: rgba(14, 165, 233, 0.05);
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border: rgba(56, 189, 248, 0.2);
        }

        body {
            background-color: var(--bg-main);
            background-image: radial-gradient(circle at 50% 50%, var(--bg-overlay) 0%, transparent 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text-primary);
        }

        /* Compact Video Card */
        .video-card {
            width: 90%;
            max-width: 400px; /* Small and focused */
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 
                        0 0 15px rgba(14, 165, 233, 0.1);
            text-align: center;
        }

        .header-area {
            margin-bottom: 1rem;
        }

        h2 {
            font-size: 1.25rem;
            color: var(--primary-light);
            font-weight: 500;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .video-container {
            position: relative;
            line-height: 0;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            border: 1px solid var(--border);
            transition: transform 0.3s ease;
        }

        .video-container:hover {
            transform: scale(1.02);
            border-color: var(--primary);
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Small decorative light at the top */
        .top-glow {
            width: 50px;
            height: 2px;
            background: var(--primary);
            margin: 0 auto 1rem;
            border-radius: 2px;
            box-shadow: 0 0 10px var(--primary);
        }
    </style>
</head>
<body>

    <div class="video-card">
        <div class="top-glow"></div>
        <div class="header-area">
            
        </div>
        
        <div class="video-container">
            <video controls autoplay playsinline>
                <source src="IMG_0814.MOV" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
    </div>

</body>
</html>
